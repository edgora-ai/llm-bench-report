<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>模型实验台</title><script>window.BENCH_GALLERY={{GALLERY_SEED}};</script><style>{{PUBLIC_CSS}}</style></head><body class="public-gallery"><a class="skip-link" href="#public-grid">跳到作品</a><header class="public-header"><a class="public-brand" href="#gallery">模型实验台</a><div class="public-header-actions"><button data-full-view="scores" class="text-button">评分历史 ↗</button><button data-full-view="evidence" class="text-button">完整记录</button><button id="public-theme" class="theme-button" aria-label="切换浅色、深色、系统主题">系统</button></div></header><main class="public-main"><div class="gallery-controls"><div class="task-purpose"><nav id="public-task-tabs" class="public-task-tabs" role="tablist" aria-label="选择任务">{{TASK_TABS}}</nav><label class="purpose-control"><span>运行用途</span><select id="public-purpose"><option value="benchmark">主评测</option><option value="smoke">冒烟测试</option><option value="">全部用途</option></select></label></div><div class="gallery-tools"><label class="sort-control"><span>排序分项 · 同题同用途同口径</span><select id="public-sort"><option value="">六项评分 · 默认顺序</option><option value="compliance">指令遵循 ↓</option><option value="recognizability">辨识度 ↓</option><option value="motion">运动表现 ↓</option><option value="visual_detail">视觉细节 ↓</option><option value="interaction">交互表现 ↓</option><option value="completeness">完整性 ↓</option></select></label></div><details id="public-models" class="public-models" open><summary>模型 / 来源</summary><div class="model-menu"><label class="score-source-control" hidden><span>评分口径 · 标签不证明身份</span><select id="public-score-source"></select></label><label class="model-search"><span>查找模型 · 部分名称匹配</span><input id="public-model" type="search" placeholder="查找模型" autocomplete="off"></label><div id="public-model-list" class="public-model-list" aria-label="精确模型 · 再次点击取消"></div></div></details></div><div class="gallery-heading"><p id="public-result-label" aria-live="polite">{{GALLERY_COUNT}}</p><p id="public-score-coverage" aria-live="polite">六项 0–4 · 未评不补分</p></div><p id="public-notice" class="public-notice" role="status" hidden></p><section id="public-grid" class="public-grid" aria-label="最新作品 · 六项评分" tabindex="-1">{{GALLERY_CARDS}}</section><nav id="public-pages" class="public-pages" aria-label="作品分页"></nav><details id="public-history" class="public-history" hidden><summary id="public-history-label">无媒体记录</summary><div id="public-history-list"></div></details><section class="more-evidence" aria-label="完整实验记录"><p>共 {{GALLERY_TOTAL}} 次。每模型/工具/任务最新，非最佳；不借用旧分。</p><nav><button data-full-view="gallery">更多筛选 ↗</button><button data-full-view="matrix">结果总览 ↗</button><button data-full-view="batch">成本与耗时 ↗</button></nav></section></main><footer class="public-footer"><span>实时原作 · 截图回退 · 无综合分</span><a id="public-offline" download="offline.html">离线完整版</a></footer><aside id="public-selection" class="public-selection" aria-label="已选比较对象" hidden><div><strong id="public-selection-label"></strong><p id="public-selection-names"></p><label class="public-mixed-label"><input id="public-mixed" type="checkbox">允许同题跨条件对照（条件见对照页）</label></div><div class="selection-actions"><button id="public-clear">清空</button><button id="public-compare" class="primary">并排对照</button></div></aside><dialog id="public-zoom" class="public-zoom" aria-labelledby="public-zoom-title"><div class="public-dialog-heading"><h2 id="public-zoom-title">采样截图</h2><button data-public-close="public-zoom" aria-label="关闭放大图像">关闭 ×</button></div><p id="public-zoom-state" role="status"></p><img id="public-zoom-image" alt=""><p class="dialog-footnote">历史截图（非实时）。</p></dialog><dialog id="original-dialog" class="public-original" aria-labelledby="original-title"><div class="public-dialog-heading"><h2 id="original-title">原作实时预览</h2><button data-public-close="original-dialog" aria-label="关闭实时原作">关闭 ×</button></div><div id="original-content"></div></dialog><noscript><p class="public-noscript">预览与筛选需 JavaScript；离线版含全部记录。</p></noscript><script>{{PUBLIC_JS}}</script></body></html>
